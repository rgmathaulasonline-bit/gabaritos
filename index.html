<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Leitor de Gabarito - OMR Robusto</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
        body { background: #eef2f5; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 32px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #0f172a; }
        .config-panel { background: #f8fafc; border-radius: 24px; padding: 20px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 25px; align-items: flex-end; border: 1px solid #e2e8f0; }
        .config-item { display: flex; flex-direction: column; gap: 6px; }
        .config-item label { font-weight: 600; font-size: 0.85rem; color: #334155; }
        .config-item input, .config-item select { padding: 8px 12px; border-radius: 40px; border: 1px solid #cbd5e1; font-size: 1rem; background: white; }
        button { background: #3b82f6; border: none; color: white; font-weight: 600; padding: 10px 20px; border-radius: 40px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        button:hover { background: #2563eb; transform: scale(0.97); }
        .btn-green { background: #10b981; }
        .btn-green:hover { background: #059669; }
        .btn-secondary { background: #475569; }
        .btn-warning { background: #eab308; color: #1e293b; }
        .two-columns { display: flex; flex-wrap: wrap; gap: 25px; margin-top: 20px; }
        .column { flex: 1; min-width: 300px; }
        .card { background: #f8fafc; border-radius: 24px; padding: 18px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .section-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        video, #imagePreview { width: 100%; border-radius: 20px; background: #0f172a; border: 2px solid #cbd5e1; max-height: 320px; object-fit: contain; }
        #resultCanvas { width: 100%; border-radius: 20px; border: 2px solid #cbd5e1; background: #0f172a; cursor: crosshair; }
        .gabarito-grid { background: white; border-radius: 20px; border: 1px solid #cbd5e1; overflow-x: auto; }
        .gabarito-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .gabarito-table th, .gabarito-table td { border: 1px solid #cbd5e1; padding: 8px 4px; text-align: center; }
        .gabarito-table select { padding: 5px; border-radius: 20px; border: 1px solid #94a3b8; background: white; cursor: pointer; }
        .gabarito-table select:hover { background: #f1f5f9; }
        .result-area { background: #eef2ff; border-radius: 24px; padding: 18px; text-align: center; margin-top: 20px; }
        .score { font-size: 2.5rem; font-weight: 800; color: #1e40af; }
        .log { background: #1e293b; color: #cbd5e6; border-radius: 20px; padding: 14px; font-family: monospace; font-size: 0.8rem; max-height: 250px; overflow-y: auto; margin-top: 20px; }
        .btn-export { background: #8b5cf6; margin-left: 10px; }
        .btn-export:hover { background: #7c3aed; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; padding-top: 15px; border-top: 1px solid #cbd5e1; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #1e40af; }
        .stat-label { font-size: 0.75rem; color: #475569; }
        .point-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; justify-content: center; }
        .point-btn { background: #8b5cf6; font-size: 0.75rem; padding: 5px 10px; margin: 0; }
        .point-btn.active { background: #10b981; }
        @media print {
            body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .marcador { background: #000000 !important; border: 1px solid #000000 !important; }
            .no-print { display: none !important; }
            .print-area { margin: 0; padding: 0.5cm; }
        }
    </style>
    <script async src="https://cdn.jsdelivr.net/npm/opencv.js" onerror="console.error('Falha OpenCV'); document.getElementById('logArea').innerHTML += '❌ ERRO: OpenCV não carregou.'"></script>
</head>
<body>
<div class="container">
    <h1>📋 Leitor de Gabarito (OMR Robusto - Grid)</h1>
    <div class="config-panel no-print">
        <div class="config-item">
            <label>✏️ Título da Prova</label>
            <input type="text" id="tituloProva" value="Simulado ENEM">
        </div>
        <div class="config-item">
            <label>🔢 Número de questões</label>
            <input type="number" id="numQuestoes" min="1" max="30" value="10" style="width: 80px;">
        </div>
        <div class="config-item">
            <label>🔤 Alternativas</label>
            <select id="numAlternativas">
                <option value="2">2 (A,B)</option><option value="3">3 (A,B,C)</option>
                <option value="4">4 (A,B,C,D)</option><option value="5" selected>5 (A,B,C,D,E)</option>
                <option value="6">6 (A,B,C,D,E,F)</option>
            </select>
        </div>
        <div class="config-item"><button id="btnAplicarConfig" class="btn-green">Aplicar e gerar cartão</button></div>
    </div>
    <div id="printArea" class="print-area" style="background: white; padding: 20px; border-radius: 16px; margin-bottom: 25px;"></div>
    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button id="btnImprimirCartao">🖨️ Imprimir cartão</button>
        <button id="btnExportarJSON" class="btn-export">📥 Exportar JSON</button>
        <button id="btnExportarCSV" class="btn-export">📊 Exportar CSV</button>
    </div>
    <div class="two-columns no-print">
        <div class="column">
            <div class="card">
                <div class="section-title">📸 Capturar cartão preenchido</div>
                <video id="video" autoplay playsinline style="width:100%; border-radius: 20px;"></video>
                <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;">
                    <button id="captureBtn">📷 Tirar Foto</button>
                    <button id="toggleCameraBtn" class="btn-warning">🔴 Desligar Câmera</button>
                    <label for="fileUpload" style="background:#475569; padding:10px 18px; border-radius:60px; color:white; cursor:pointer;">📁 Enviar Imagem</label>
                    <input type="file" id="fileUpload" accept="image/jpeg,image/png" style="display:none;">
                </div>
                <canvas id="canvas" style="display:none;"></canvas>
                <div id="previewArea" style="margin-top: 15px;">
                    <canvas id="resultCanvas" style="width:100%; border-radius: 20px;"></canvas>
                </div>
                <div class="point-selector">
                    <span style="font-size:12px;">Clique nos 4 cantos da folha:</span>
                    <button id="point1Btn" class="point-btn">Ponto 1</button>
                    <button id="point2Btn" class="point-btn">Ponto 2</button>
                    <button id="point3Btn" class="point-btn">Ponto 3</button>
                    <button id="point4Btn" class="point-btn">Ponto 4</button>
                    <button id="resetPointsBtn" class="point-btn">Resetar</button>
                </div>
            </div>
        </div>
        <div class="column">
            <div class="card">
                <div class="section-title">✅ Gabarito Oficial <span id="gabaritoStatus" style="font-size: 0.7rem;"></span></div>
                <div id="gabaritoDinamico" class="gabarito-grid"></div>
                <button id="resetGabaritoBtn" class="btn-secondary" style="margin-top: 16px;">Restaurar exemplo (cíclico)</button>
                <button id="validarGabaritoBtn" class="btn-secondary" style="margin-top: 8px;">✓ Validar preenchimento</button>
            </div>
            <button id="corrigirBtn" class="btn-green" style="width:100%; font-size:1.2rem;">✨ CORRIGIR PROVA</button>
            <div id="resultArea" class="result-area" style="display:none;">
                <div>🎯 ACERTOS</div>
                <div class="score" id="scoreDisplay">0/0</div>
                <div id="gradeDetail"></div>
                <div class="stats" id="statsArea"></div>
            </div>
        </div>
    </div>
    <div class="log no-print" id="logArea">⏳ Aguardando OpenCV.js carregar...</div>
</div>

<script>
    // ----------------------------- ESTADO GLOBAL -----------------------------
    let currentImageData = null;
    let numQuestoes = 10;
    let numAlternativas = 5;
    let letras = ['A','B','C','D','E','F','G','H'];
    let cvReady = false;
    let cameraActive = true;
    let stream = null;
    let ultimaCorrecao = null;
    
    // Pontos para transformação de perspectiva
    let pontos = [
        { x: 0.2, y: 0.2 },   // canto superior esquerdo
        { x: 0.8, y: 0.2 },   // canto superior direito
        { x: 0.8, y: 0.8 },   // canto inferior direito
        { x: 0.2, y: 0.8 }    // canto inferior esquerdo
    ];
    let pontoAtual = 0;
    let imagemOriginalWidth = 0, imagemOriginalHeight = 0;
    let warpedImageCache = null; // cache da imagem warpada para debug

    // Elementos DOM
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const fileUpload = document.getElementById('fileUpload');
    const resultCanvas = document.getElementById('resultCanvas');
    const corrigirBtn = document.getElementById('corrigirBtn');
    const resultArea = document.getElementById('resultArea');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const gradeDetail = document.getElementById('gradeDetail');
    const logArea = document.getElementById('logArea');
    const resetGabaritoBtn = document.getElementById('resetGabaritoBtn');
    const validarGabaritoBtn = document.getElementById('validarGabaritoBtn');
    const btnAplicarConfig = document.getElementById('btnAplicarConfig');
    const btnImprimirCartao = document.getElementById('btnImprimirCartao');
    const tituloProvaInput = document.getElementById('tituloProva');
    const numQuestoesInput = document.getElementById('numQuestoes');
    const numAlternativasSelect = document.getElementById('numAlternativas');
    const btnExportarJSON = document.getElementById('btnExportarJSON');
    const btnExportarCSV = document.getElementById('btnExportarCSV');
    const gabaritoStatus = document.getElementById('gabaritoStatus');
    const statsArea = document.getElementById('statsArea');
    
    // Botões dos pontos
    const point1Btn = document.getElementById('point1Btn');
    const point2Btn = document.getElementById('point2Btn');
    const point3Btn = document.getElementById('point3Btn');
    const point4Btn = document.getElementById('point4Btn');
    const resetPointsBtn = document.getElementById('resetPointsBtn');

    // ---------- ESPERA ATIVA PELO OpenCV ----------
    function esperarOpenCV() {
        if (typeof cv !== 'undefined' && cv.Mat && cv.imread) {
            cvReady = true;
            logArea.innerHTML = "✅ OpenCV.js carregado! Clique nos 4 cantos da folha na imagem.";
        } else {
            logArea.innerHTML = "⏳ Carregando OpenCV... (verificando a cada 500ms)";
            setTimeout(esperarOpenCV, 500);
        }
    }
    esperarOpenCV();

    // ---------- CÂMERA ----------
    async function iniciarCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
            video.srcObject = stream; await video.play(); cameraActive = true;
            toggleCameraBtn.textContent = "🔴 Desligar Câmera"; logArea.innerHTML += "\n📷 Câmera iniciada.";
        } catch (err) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream; await video.play(); cameraActive = true;
                toggleCameraBtn.textContent = "🔴 Desligar Câmera"; logArea.innerHTML += "\n📷 Câmera frontal iniciada.";
            } catch (e) { logArea.innerHTML += "\n❌ Erro na câmera. Use upload de imagem."; cameraActive = false; toggleCameraBtn.textContent = "🟢 Ligar Câmera"; }
        }
    }
    function desligarCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; video.srcObject = null; } cameraActive = false; toggleCameraBtn.textContent = "🟢 Ligar Câmera"; logArea.innerHTML += "\n📷 Câmera desligada."; }
    function toggleCamera() { cameraActive ? desligarCamera() : iniciarCamera(); }

    // ---------- DESENHAR PONTOS E IMAGEM ----------
    function desenharImagemComPontos(imgElement) {
        const ctx = resultCanvas.getContext('2d');
        resultCanvas.width = imgElement.width;
        resultCanvas.height = imgElement.height;
        ctx.drawImage(imgElement, 0, 0);
        
        // Desenhar os pontos e numerá-los
        for (let i = 0; i < pontos.length; i++) {
            const x = pontos[i].x * resultCanvas.width;
            const y = pontos[i].y * resultCanvas.height;
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, 2 * Math.PI);
            ctx.fillStyle = i === pontoAtual ? '#00ff00' : '#ff0000';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText((i+1).toString(), x-5, y+6);
        }
    }
    
    function atualizarExibicaoComPontos() {
        if (!currentImageData) return;
        let img = new Image();
        img.onload = () => {
            imagemOriginalWidth = img.width;
            imagemOriginalHeight = img.height;
            desenharImagemComPontos(img);
        };
        img.src = currentImageData;
    }
    
    // ---------- MANIPULAÇÃO DE CLICKS NO CANVAS ----------
    resultCanvas.addEventListener('click', (e) => {
        if (!currentImageData) {
            logArea.innerHTML += "\n⚠️ Carregue uma imagem primeiro.";
            return;
        }
        const rect = resultCanvas.getBoundingClientRect();
        const scaleX = resultCanvas.width / rect.width;
        const scaleY = resultCanvas.height / rect.height;
        let canvasX = (e.clientX - rect.left) * scaleX;
        let canvasY = (e.clientY - rect.top) * scaleY;
        canvasX = Math.min(Math.max(0, canvasX), resultCanvas.width);
        canvasY = Math.min(Math.max(0, canvasY), resultCanvas.height);
        
        pontos[pontoAtual] = { x: canvasX / resultCanvas.width, y: canvasY / resultCanvas.height };
        pontoAtual = (pontoAtual + 1) % 4;
        
        // Atualizar estilo dos botões
        [point1Btn, point2Btn, point3Btn, point4Btn].forEach((btn, idx) => {
            if (idx === pontoAtual) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        
        atualizarExibicaoComPontos();
        logArea.innerHTML += `\n📍 Ponto ${pontoAtual === 0 ? 4 : pontoAtual} definido. ${pontoAtual === 0 ? 'Todos os pontos definidos!' : `Agora defina o ponto ${pontoAtual+1}`}`;
    });
    
    function resetarPontos() {
        pontos = [
            { x: 0.2, y: 0.2 },
            { x: 0.8, y: 0.2 },
            { x: 0.8, y: 0.8 },
            { x: 0.2, y: 0.8 }
        ];
        pontoAtual = 0;
        [point1Btn, point2Btn, point3Btn, point4Btn].forEach((btn, idx) => {
            if (idx === 0) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        atualizarExibicaoComPontos();
        logArea.innerHTML += "\n🔄 Pontos resetados. Clique nos 4 cantos novamente.";
    }
    
    point1Btn.addEventListener('click', () => { pontoAtual = 0; atualizarBotoesAtivos(); });
    point2Btn.addEventListener('click', () => { pontoAtual = 1; atualizarBotoesAtivos(); });
    point3Btn.addEventListener('click', () => { pontoAtual = 2; atualizarBotoesAtivos(); });
    point4Btn.addEventListener('click', () => { pontoAtual = 3; atualizarBotoesAtivos(); });
    resetPointsBtn.addEventListener('click', resetarPontos);
    
    function atualizarBotoesAtivos() {
        [point1Btn, point2Btn, point3Btn, point4Btn].forEach((btn, idx) => {
            if (idx === pontoAtual) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        logArea.innerHTML += `\n🎯 Editando ponto ${pontoAtual+1}. Clique no canvas para mover.`;
    }
    
    // ---------- CAPTURA / UPLOAD ----------
    function processarImagemRecente(imageData) {
        currentImageData = imageData;
        resetarPontos(); // resetar pontos para nova imagem
        logArea.innerHTML += "\n📸 Imagem carregada. Clique nos 4 cantos da folha no canvas.";
    }
    
    function capturarFoto() {
        if (!video.videoWidth || !cameraActive) { logArea.innerHTML += "\n⚠️ Câmera não ativa."; return; }
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        let imageData = canvas.toDataURL('image/jpeg', 0.9);
        processarImagemRecente(imageData);
    }
    
    function carregarUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            processarImagemRecente(e.target.result);
            if (stream && cameraActive) desligarCamera();
        };
        reader.readAsDataURL(file);
    }
    
    // ---------- FUNÇÃO PRINCIPAL DE OMR (GRID) - BASEADA NO SEGUNDO CÓDIGO ----------
    async function executarCorrecao() {
        if (!currentImageData) {
            logArea.innerHTML += "\n⚠️ Nenhuma imagem. Tire foto ou faça upload.";
            return;
        }
        const gabarito = obterGabaritoDaTela();
        if (Object.keys(gabarito).length === 0) {
            alert("❌ Nenhuma resposta definida no gabarito!\n\nPreencha o gabarito à direita antes de corrigir.");
            return;
        }
        if (!cvReady) {
            logArea.innerHTML += "\n⏳ OpenCV ainda carregando. Tente em alguns segundos.";
            return;
        }
        
        logArea.innerHTML += "\n🔍 Aplicando correção de perspectiva e detectando marcações (OMR)...";
        
        try {
            // Carregar imagem
            let img = new Image();
            img.src = currentImageData;
            await new Promise((resolve) => { img.onload = resolve; });
            
            let src = cv.imread(img);
            
            // Obter pontos absolutos
            let ptsAbs = pontos.map(p => ({ x: p.x * src.cols, y: p.y * src.rows }));
            
            // Definir tamanho da imagem warpada (padrão 1000x1300)
            const DW = 1000;
            const DH = 1300;
            
            // Criar matrizes de transformação
            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                ptsAbs[0].x, ptsAbs[0].y,
                ptsAbs[1].x, ptsAbs[1].y,
                ptsAbs[2].x, ptsAbs[2].y,
                ptsAbs[3].x, ptsAbs[3].y
            ]);
            
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, DW, 0, DW, DH, 0, DH]);
            
            // Calcular matriz de perspectiva
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            
            // Aplicar warp
            let warped = new cv.Mat();
            cv.warpPerspective(src, warped, M, new cv.Size(DW, DH));
            
            // Converter para escala de cinza
            let gray = new cv.Mat();
            cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            
            // Aplicar blur para reduzir ruído
            let blurred = new cv.Mat();
            cv.GaussianBlur(gray, blurred, new cv.Size(3, 3), 0);
            
            // Binarização com OTSU
            let binary = new cv.Mat();
            cv.threshold(blurred, binary, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);
            
            // Dimensões do grid
            const rows = numQuestoes;
            const cols = numAlternativas;
            const ch = Math.floor(DH / rows);  // altura de cada célula
            const cw = Math.floor(DW / cols);  // largura de cada célula
            
            logArea.innerHTML += `\n📐 Grid: ${rows}x${cols} | Célula: ${cw}x${ch}px`;
            
            let respostasAluno = {};
            let circlesPositions = {};
            
            // Analisar cada célula
            for (let r = 0; r < rows; r++) {
                let melhorAlternativa = -1;
                let maiorContagem = 0;
                let segundaMaior = 0;
                let contagens = [];
                
                for (let c = 0; c < cols; c++) {
                    // Extrair ROI da célula
                    let x = c * cw;
                    let y = r * ch;
                    let cell = binary.roi(new cv.Rect(x, y, cw, ch));
                    
                    // Contar pixels não-zero (preenchidos)
                    let nz = cv.countNonZero(cell);
                    contagens.push(nz);
                    
                    // Guardar posição para desenho
                    if (!circlesPositions[r+1]) circlesPositions[r+1] = {};
                    circlesPositions[r+1][letras[c]] = {
                        x: x + cw/2,
                        y: y + ch/2,
                        r: Math.min(cw, ch) * 0.35
                    };
                    
                    if (nz > maiorContagem) {
                        segundaMaior = maiorContagem;
                        maiorContagem = nz;
                        melhorAlternativa = c;
                    } else if (nz > segundaMaior) {
                        segundaMaior = nz;
                    }
                    
                    cell.delete();
                }
                
                // Critérios para considerar válido:
                const minFill = cw * ch * 0.08; // mínimo 8% da célula preenchida
                const isValido = (maiorContagem >= minFill) && (segundaMaior === 0 || maiorContagem > segundaMaior * 1.3);
                
                if (isValido && melhorAlternativa !== -1) {
                    respostasAluno[r+1] = letras[melhorAlternativa];
                    logArea.innerHTML += `\n   Questão ${r+1}: ${letras[melhorAlternativa]} (${maiorContagem} pixels)`;
                } else if (maiorContagem >= minFill) {
                    logArea.innerHTML += `\n   ⚠️ Questão ${r+1}: marcação ambígua (${maiorContagem} vs ${segundaMaior})`;
                } else {
                    logArea.innerHTML += `\n   ❌ Questão ${r+1}: não detectado (${maiorContagem} pixels)`;
                }
            }
            
            // Desenhar resultado na imagem warpada
            let resultImg = warped.clone();
            for (let q in circlesPositions) {
                for (let alt in circlesPositions[q]) {
                    let pos = circlesPositions[q][alt];
                    let cor = [200, 200, 200, 200];
                    if (respostasAluno[q] === alt) {
                        cor = [0, 255, 0, 255]; // verde para marcada
                    } else if (gabarito[q] === alt) {
                        cor = [255, 0, 0, 255]; // vermelho para gabarito
                    }
                    cv.circle(resultImg, new cv.Point(pos.x, pos.y), pos.r, cor, 2);
                }
            }
            
            // Exibir imagem warpada com marcações
            let canvasWarp = document.createElement('canvas');
            canvasWarp.width = resultImg.cols;
            canvasWarp.height = resultImg.rows;
            cv.imshow(canvasWarp, resultImg);
            warpedImageCache = canvasWarp.toDataURL('image/jpeg', 0.9);
            
            let imgFinal = new Image();
            imgFinal.onload = () => {
                resultCanvas.width = imgFinal.width;
                resultCanvas.height = imgFinal.height;
                resultCanvas.getContext('2d').drawImage(imgFinal, 0, 0);
            };
            imgFinal.src = warpedImageCache;
            
            // Calcular resultados
            let acertos = 0;
            let detalhes = [];
            let estatisticas = { corretas: [], erradas: [], naoDetectadas: [] };
            
            for (let i = 1; i <= numQuestoes; i++) {
                let correta = gabarito[i];
                let aluno = respostasAluno[i];
                if (correta && aluno && correta.trim() === aluno.trim()) {
                    acertos++;
                    detalhes.push(`✅ Q${i}: ${aluno}`);
                    estatisticas.corretas.push(i);
                } else if (correta && aluno) {
                    detalhes.push(`❌ Q${i}: ${aluno} (gabarito ${correta})`);
                    estatisticas.erradas.push(i);
                } else if (correta && !aluno) {
                    detalhes.push(`⚠️ Q${i}: não detectado (gabarito ${correta})`);
                    estatisticas.naoDetectadas.push(i);
                }
            }
            
            let nota = (acertos / numQuestoes) * 10;
            let percentual = (acertos / numQuestoes) * 100;
            scoreDisplay.innerText = `${acertos}/${numQuestoes}`;
            gradeDetail.innerHTML = `🎓 NOTA: ${nota.toFixed(1)} (${percentual.toFixed(1)}%)<br>${acertos} acerto${acertos!==1?'s':''}`;
            statsArea.innerHTML = `
                <div class="stat-item"><div class="stat-value" style="color:#10b981;">${estatisticas.corretas.length}</div><div class="stat-label">Acertos</div></div>
                <div class="stat-item"><div class="stat-value" style="color:#ef4444;">${estatisticas.erradas.length}</div><div class="stat-label">Erros</div></div>
                <div class="stat-item"><div class="stat-value" style="color:#eab308;">${estatisticas.naoDetectadas.length}</div><div class="stat-label">Não detectadas</div></div>
                <div class="stat-item"><div class="stat-value">${nota.toFixed(1)}</div><div class="stat-label">Nota (0-10)</div></div>
            `;
            resultArea.style.display = 'block';
            logArea.innerHTML += `\n📊 CORREÇÃO FINALIZADA: ${acertos}/${numQuestoes} acertos`;
            
            ultimaCorrecao = {
                data: new Date().toLocaleString(),
                titulo: tituloProvaInput.value,
                totalQuestoes: numQuestoes,
                totalAlternativas: numAlternativas,
                acertos: acertos,
                nota: nota.toFixed(1),
                percentual: percentual.toFixed(1),
                detalhes: detalhes,
                respostasAluno: respostasAluno,
                gabarito: gabarito,
                estatisticas: estatisticas
            };
            
            // Liberar memória
            src.delete(); srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
            gray.delete(); blurred.delete(); binary.delete(); resultImg.delete();
            
        } catch (err) {
            logArea.innerHTML += `\n❌ Erro na correção: ${err.message}`;
            alert(`Erro na correção: ${err.message}\n\nVerifique se os 4 pontos estão nos cantos da folha.`);
        }
    }
    
    // ---------- GERAÇÃO DO CARTÃO (impressão) ----------
    function gerarCartaoHTML(titulo, qtd, altCount) {
        let letrasUsadas = letras.slice(0, altCount);
        return `<div style="position: relative; font-family: Arial, sans-serif; background: white; padding: 20px; border: 1px solid #ccc;">
            <div class="marcador" style="position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; background: #000000; border: 1px solid #000000;"></div>
            <div class="marcador" style="position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; background: #000000; border: 1px solid #000000;"></div>
            <div class="marcador" style="position: absolute; bottom: 10px; left: 10px; width: 22px; height: 22px; background: #000000; border: 1px solid #000000;"></div>
            <div class="marcador" style="position: absolute; bottom: 10px; right: 10px; width: 22px; height: 22px; background: #000000; border: 1px solid #000000;"></div>
            <h2 style="text-align: center;">${titulo}</h2>
            <p><strong>NOME:</strong> _________________ &nbsp; <strong>DATA:</strong> ___/___/___ &nbsp; <strong>TURMA:</strong> _______</p>
            <p><strong>Total questões:</strong> ${qtd} &nbsp; | &nbsp; <strong>Alternativas:</strong> ${letrasUsadas.join(', ')}</p>
            <p><em>Instrução: PINTE COMPLETAMENTE a bolinha da alternativa com caneta AZUL ou PRETA.</em></p>
            <table style="border-collapse: collapse; width: 100%; border: 1px solid #000;">
                <thead><tr style="background:#eee;"><th style="border:1px solid #000; padding:10px;">Questão</th>${letrasUsadas.map(l => `<th style="border:1px solid #000; padding:10px;">${l}</th>`).join('')} </tr></thead>
                <tbody>${Array.from({length: qtd}, (_,i) => `<tr><td style="border:1px solid #000; text-align:center; padding:12px;">${i+1}</td>${letrasUsadas.map(() => `<td style="border:1px solid #000; text-align:center;"><span style="display:inline-block; width:28px; height:28px; border-radius:50%; border:2px solid black; background:white;"></span></td>`).join('')}</tr>`).join('')}</tbody>
            </table>
            <p style="font-size:12px; text-align:center;">Sistema de correção automática - enquadre toda a folha na foto.</p>
        </div>`;
    }
    
    function atualizarCartao() {
        let titulo = tituloProvaInput.value.trim() || "Avaliação";
        numQuestoes = parseInt(numQuestoesInput.value, 10); numAlternativas = parseInt(numAlternativasSelect.value, 10);
        if (isNaN(numQuestoes)) numQuestoes = 10;
        numQuestoes = Math.min(30, Math.max(1, numQuestoes));
        document.getElementById('printArea').innerHTML = gerarCartaoHTML(titulo, numQuestoes, numAlternativas);
        gerarInterfaceGabarito();
        atualizarStatusGabarito();
    }
    
    function gerarInterfaceGabarito() {
        const container = document.getElementById('gabaritoDinamico'); container.innerHTML = '';
        const table = document.createElement('table'); table.className = 'gabarito-table';
        let letrasUsadas = letras.slice(0, numAlternativas);
        let thead = table.createTHead(); let headerRow = thead.insertRow(); headerRow.insertCell().innerText = 'Questão';
        for (let l of letrasUsadas) headerRow.insertCell().innerText = l;
        let tbody = table.createTBody();
        for (let i = 1; i <= numQuestoes; i++) {
            let row = tbody.insertRow(); row.insertCell().innerText = i;
            for (let alt of letrasUsadas) {
                let cell = row.insertCell(); let select = document.createElement('select');
                select.innerHTML = `<option value="" selected>-</option>${letrasUsadas.map(a => `<option value="${a}">${a}</option>`).join('')}`;
                select.addEventListener('change', () => atualizarStatusGabarito()); cell.appendChild(select);
            }
        }
        container.appendChild(table); atualizarStatusGabarito();
    }
    
    function atualizarStatusGabarito() {
        const gabarito = obterGabaritoDaTela(); const preenchidas = Object.keys(gabarito).length; const faltam = numQuestoes - preenchidas;
        if (faltam === 0) gabaritoStatus.innerHTML = '<span style="color: #10b981;">✓ Todas preenchidas</span>';
        else gabaritoStatus.innerHTML = `<span style="color: #eab308;">⚠️ ${faltam} questão(ões) sem gabarito</span>`;
    }
    
    function obterGabaritoDaTela() {
        let gabarito = {};
        const linhas = document.querySelectorAll('#gabaritoDinamico table tbody tr');
        for (let i = 0; i < linhas.length; i++) {
            const selects = linhas[i].querySelectorAll('select');
            let respostaEncontrada = false;
            for (let select of selects) {
                let valor = select.value.trim();
                if (valor && valor !== "") { gabarito[i+1] = valor; respostaEncontrada = true; break; }
            }
            if (!respostaEncontrada) console.warn(`Questão ${i+1} sem gabarito`);
        }
        return gabarito;
    }
    
    function restaurarGabaritoExemplo() {
        let letrasUsadas = letras.slice(0, numAlternativas);
        const selects = document.querySelectorAll('#gabaritoDinamico select');
        selects.forEach((select, index) => { let questao = Math.floor(index / numAlternativas) + 1; select.value = letrasUsadas[(questao-1) % letrasUsadas.length]; });
        atualizarStatusGabarito(); logArea.innerHTML += "\n🔄 Gabarito exemplo cíclico carregado.";
    }
    
    function validarPreenchimentoGabarito() {
        const gabarito = obterGabaritoDaTela(); const faltando = [];
        for (let i = 1; i <= numQuestoes; i++) if (!gabarito[i]) faltando.push(i);
        if (faltando.length) alert(`⚠️ Faltam questões: ${faltando.join(', ')}`);
        else alert(`✓ Gabarito completo!`);
        return faltando.length === 0;
    }
    
    // ---------- EXPORTAÇÃO ----------
    function exportarJSON() { if (!ultimaCorrecao) { alert("Nenhuma correção realizada ainda."); return; } const dataStr = JSON.stringify(ultimaCorrecao, null, 2); const blob = new Blob([dataStr], {type:"application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `correcao_${new Date().toISOString().slice(0,19)}.json`; a.click(); URL.revokeObjectURL(blob); logArea.innerHTML += "\n📄 JSON exportado."; }
    function exportarCSV() { if (!ultimaCorrecao) { alert("Nenhuma correção."); return; } let csvRows = [["Questão","Gabarito","Resposta Aluno","Resultado"]]; for (let i=1;i<=numQuestoes;i++) { let gab = ultimaCorrecao.gabarito[i] || "-"; let resp = ultimaCorrecao.respostasAluno[i] || "-"; let res = (gab === resp) ? "Acertou" : (resp !== "-" ? "Errou" : "Não detectado"); csvRows.push([i, gab, resp, res]); } csvRows.push(["","","",""],["Total Acertos",ultimaCorrecao.acertos,"",""],["Total Questões",ultimaCorrecao.totalQuestoes,"",""],["Nota",ultimaCorrecao.nota,"",""],["Percentual",ultimaCorrecao.percentual+"%","",""],["Data",ultimaCorrecao.data,"",""]); const csvContent = csvRows.map(row => row.map(cell => `"${cell}"`).join(",")).join("\n"); const blob = new Blob(["\uFEFF"+csvContent], {type:"text/csv;charset=utf-8;"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `correcao_${new Date().toISOString().slice(0,19)}.csv`; a.click(); URL.revokeObjectURL(blob); logArea.innerHTML += "\n📊 CSV exportado."; }
    
    // ---------- EVENTOS ----------
    captureBtn.addEventListener('click', capturarFoto);
    toggleCameraBtn.addEventListener('click', toggleCamera);
    fileUpload.addEventListener('change', (e) => { if(e.target.files[0]) carregarUpload(e.target.files[0]); });
    corrigirBtn.addEventListener('click', executarCorrecao);
    resetGabaritoBtn.addEventListener('click', restaurarGabaritoExemplo);
    validarGabaritoBtn.addEventListener('click', validarPreenchimentoGabarito);
    btnAplicarConfig.addEventListener('click', () => { atualizarCartao(); logArea.innerHTML += "\n⚙️ Configurações aplicadas."; });
    btnImprimirCartao.addEventListener('click', () => { let conteudo = document.getElementById('printArea').innerHTML; let win = window.open('', '_blank'); win.document.write(`<html><head><title>Cartão de Respostas</title><style>@media print{ body{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;} .marcador{background:#000 !important;} } .marcador{width:22px;height:22px;background:#000;border:1px solid #000;} body{margin:0;padding:20px;}</style></head><body>${conteudo}</body></html>`); win.document.close(); win.print(); });
    btnExportarJSON.addEventListener('click', exportarJSON);
    btnExportarCSV.addEventListener('click', exportarCSV);
    
    // Inicialização
    iniciarCamera();
    atualizarCartao();
</script>
