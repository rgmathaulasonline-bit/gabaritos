<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor de Gabarito</title>

<!-- OpenCV -->
<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}
video, canvas {
    width: 90%;
    max-width: 500px;
    margin-top: 10px;
}
button {
    padding: 10px;
    margin: 10px;
}
</style>
</head>

<body>

<h2>📷 Leitor de Gabarito</h2>

<p id="status">🔄 Carregando OpenCV...</p>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<br>
<button onclick="capturar()">📸 Capturar</button>

<p id="resultado"></p>

<script>
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let pronto = false;

// Gabarito
let GABARITO = [3,3,3,3,3,3,3,3,3,3];

// Esperar OpenCV carregar corretamente
function iniciarOpenCV() {
    if (typeof cv !== "undefined") {
        cv['onRuntimeInitialized'] = () => {
            document.getElementById("status").innerText = "✅ OpenCV carregado";
            pronto = true;
        };
    } else {
        setTimeout(iniciarOpenCV, 100);
    }
}
iniciarOpenCV();

// Ativar câmera
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => video.srcObject = stream)
.catch(err => {
    document.getElementById("status").innerText = "Erro na câmera";
});

function capturar() {
    if (!pronto) {
        alert("OpenCV ainda não carregou!");
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    try {
        let src = cv.imread(canvas);
        let gray = new cv.Mat();
        let blur = new cv.Mat();
        let edged = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, blur, new cv.Size(5,5), 0);
        cv.Canny(blur, edged, 50, 150);

        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();

        cv.findContours(edged, contours, hierarchy,
            cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let maior = null;
        let maiorArea = 0;

        for (let i = 0; i < contours.size(); i++) {
            let cnt = contours.get(i);
            let area = cv.contourArea(cnt);

            if (area > maiorArea) {
                maiorArea = area;
                maior = cnt;
            }
        }

        if (!maior) {
            document.getElementById("resultado").innerText = "❌ Gabarito não encontrado";
            return;
        }

        let rect = cv.boundingRect(maior);
        let roi = src.roi(rect);

        let roiGray = new cv.Mat();
        cv.cvtColor(roi, roiGray, cv.COLOR_RGBA2GRAY);

        let thresh = new cv.Mat();
        cv.threshold(roiGray, thresh, 0, 255,
            cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

        cv.imshow(canvas, thresh);

        document.getElementById("resultado").innerText =
            "✅ Captura realizada (detecção básica funcionando)";

        // liberar memória
        src.delete(); gray.delete(); blur.delete(); edged.delete();
        contours.delete(); hierarchy.delete();
        roi.delete(); roiGray.delete(); thresh.delete();

    } catch (erro) {
        document.getElementById("resultado").innerText =
            "Erro: " + erro.message;
    }
}
</script>

</body>
</html>
