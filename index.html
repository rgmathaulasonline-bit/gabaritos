<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Corretor com Marcadores Amarelos e Retângulo Verde</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
        body { background: #eef2f5; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 32px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #0f172a; }
        .config-panel { background: #f8fafc; border-radius: 24px; padding: 20px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 25px; align-items: flex-end; border: 1px solid #e2e8f0; }
        .config-item { display: flex; flex-direction: column; gap: 6px; }
        .config-item label { font-weight: 600; font-size: 0.85rem; color: #334155; }
        .config-item input, .config-item select { padding: 8px 12px; border-radius: 40px; border: 1px solid #cbd5e1; font-size: 1rem; background: white; }
        button { background: #3b82f6; border: none; color: white; font-weight: 600; padding: 10px 20px; border-radius: 40px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        button:hover { background: #2563eb; transform: scale(0.97); }
        .btn-green { background: #10b981; }
        .btn-green:hover { background: #059669; }
        .btn-secondary { background: #475569; }
        .btn-warning { background: #eab308; color: #1e293b; }
        .two-columns { display: flex; flex-wrap: wrap; gap: 25px; margin-top: 20px; }
        .column { flex: 1; min-width: 300px; }
        .card { background: #f8fafc; border-radius: 24px; padding: 18px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .section-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        video, #imagePreview { width: 100%; border-radius: 20px; background: #0f172a; border: 2px solid #cbd5e1; max-height: 320px; object-fit: contain; }
        #resultCanvas { width: 100%; border-radius: 20px; border: 2px solid #cbd5e1; background: #0f172a; cursor: crosshair; }
        .gabarito-grid { background: white; border-radius: 20px; border: 1px solid #cbd5e1; overflow-x: auto; }
        .gabarito-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .gabarito-table th, .gabarito-table td { border: 1px solid #cbd5e1; padding: 8px 4px; text-align: center; }
        .gabarito-table select { padding: 5px; border-radius: 20px; border: 1px solid #94a3b8; background: white; cursor: pointer; }
        .gabarito-table select:hover { background: #f1f5f9; }
        .result-area { background: #eef2ff; border-radius: 24px; padding: 18px; text-align: center; margin-top: 20px; }
        .score { font-size: 2.5rem; font-weight: 800; color: #1e40af; }
        .log { background: #1e293b; color: #cbd5e6; border-radius: 20px; padding: 14px; font-family: monospace; font-size: 0.8rem; max-height: 250px; overflow-y: auto; margin-top: 20px; }
        .btn-export { background: #8b5cf6; margin-left: 10px; }
        .btn-export:hover { background: #7c3aed; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; padding-top: 15px; border-top: 1px solid #cbd5e1; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #1e40af; }
        .stat-label { font-size: 0.75rem; color: #475569; }
        @media print {
            body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .marcador { background: #000000 !important; border: 1px solid #000000 !important; }
            .no-print { display: none !important; }
            .print-area { margin: 0; padding: 0.5cm; }
        }
    </style>
    <script async src="https://cdn.jsdelivr.net/npm/opencv.js" onerror="console.error('Falha OpenCV'); document.getElementById('logArea').innerHTML += '❌ ERRO: OpenCV não carregou.'"></script>
</head>
<body>
<div class="container">
    <h1>📋 Corretor com Marcadores Amarelos + Retângulo Verde</h1>
    <div class="config-panel no-print">
        <div class="config-item">
            <label>✏️ Título da Prova</label>
            <input type="text" id="tituloProva" value="Simulado ENEM">
        </div>
        <div class="config-item">
            <label>🔢 Número de questões</label>
            <input type="number" id="numQuestoes" min="1" max="30" value="10" style="width: 80px;">
        </div>
        <div class="config-item">
            <label>🔤 Alternativas</label>
            <select id="numAlternativas">
                <option value="2">2 (A,B)</option><option value="3">3 (A,B,C)</option>
                <option value="4">4 (A,B,C,D)</option><option value="5" selected>5 (A,B,C,D,E)</option>
                <option value="6">6 (A,B,C,D,E,F)</option>
            </select>
        </div>
        <div class="config-item"><button id="btnAplicarConfig" class="btn-green">Aplicar e gerar cartão</button></div>
    </div>
    <div id="printArea" class="print-area" style="background: white; padding: 20px; border-radius: 16px; margin-bottom: 25px;"></div>
    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button id="btnImprimirCartao">🖨️ Imprimir cartão</button>
        <button id="btnExportarJSON" class="btn-export">📥 Exportar JSON</button>
        <button id="btnExportarCSV" class="btn-export">📊 Exportar CSV</button>
    </div>
    <div class="two-columns no-print">
        <div class="column">
            <div class="card">
                <div class="section-title">📸 Capturar cartão preenchido</div>
                <video id="video" autoplay playsinline style="width:100%; border-radius: 20px;"></video>
                <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;">
                    <button id="captureBtn">📷 Tirar Foto</button>
                    <button id="toggleCameraBtn" class="btn-warning">🔴 Desligar Câmera</button>
                    <label for="fileUpload" style="background:#475569; padding:10px 18px; border-radius:60px; color:white; cursor:pointer;">📁 Enviar Imagem</label>
                    <input type="file" id="fileUpload" accept="image/jpeg,image/png" style="display:none;">
                </div>
                <canvas id="canvas" style="display:none;"></canvas>
                <div id="previewArea" style="margin-top: 15px;"><canvas id="resultCanvas" style="width:100%; border-radius: 20px;"></canvas></div>
            </div>
        </div>
        <div class="column">
            <div class="card">
                <div class="section-title">✅ Gabarito Oficial <span id="gabaritoStatus" style="font-size: 0.7rem;"></span></div>
                <div id="gabaritoDinamico" class="gabarito-grid"></div>
                <button id="resetGabaritoBtn" class="btn-secondary" style="margin-top: 16px;">Restaurar exemplo (cíclico)</button>
                <button id="validarGabaritoBtn" class="btn-secondary" style="margin-top: 8px;">✓ Validar preenchimento</button>
            </div>
            <button id="corrigirBtn" class="btn-green" style="width:100%; font-size:1.2rem;">✨ CORRIGIR PROVA</button>
            <div id="resultArea" class="result-area" style="display:none;">
                <div>🎯 ACERTOS</div>
                <div class="score" id="scoreDisplay">0/0</div>
                <div id="gradeDetail"></div>
                <div class="stats" id="statsArea"></div>
            </div>
        </div>
    </div>
    <div class="log no-print" id="logArea">⏳ Aguardando OpenCV.js carregar...</div>
</div>

<script>
    let currentImageData = null, numQuestoes = 10, numAlternativas = 5;
    let letras = ['A','B','C','D','E','F','G','H'];
    let cvReady = false, cameraActive = true, stream = null, ultimaCorrecao = null;
    const video = document.getElementById('video'), canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn'), toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const fileUpload = document.getElementById('fileUpload'), resultCanvas = document.getElementById('resultCanvas');
    const corrigirBtn = document.getElementById('corrigirBtn'), resultArea = document.getElementById('resultArea');
    const scoreDisplay = document.getElementById('scoreDisplay'), gradeDetail = document.getElementById('gradeDetail');
    const logArea = document.getElementById('logArea'), resetGabaritoBtn = document.getElementById('resetGabaritoBtn');
    const validarGabaritoBtn = document.getElementById('validarGabaritoBtn'), btnAplicarConfig = document.getElementById('btnAplicarConfig');
    const btnImprimirCartao = document.getElementById('btnImprimirCartao'), tituloProvaInput = document.getElementById('tituloProva');
    const numQuestoesInput = document.getElementById('numQuestoes'), numAlternativasSelect = document.getElementById('numAlternativas');
    const btnExportarJSON = document.getElementById('btnExportarJSON'), btnExportarCSV = document.getElementById('btnExportarCSV');
    const gabaritoStatus = document.getElementById('gabaritoStatus'), statsArea = document.getElementById('statsArea');

    function esperarOpenCV() {
        if (typeof cv !== 'undefined' && cv.Mat && cv.imread) { cvReady = true; logArea.innerHTML = "✅ OpenCV.js carregado!"; }
        else { logArea.innerHTML = "⏳ Carregando OpenCV..."; setTimeout(esperarOpenCV, 500); }
    }
    esperarOpenCV();

    async function iniciarCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
            video.srcObject = stream; await video.play(); cameraActive = true;
            toggleCameraBtn.textContent = "🔴 Desligar Câmera"; logArea.innerHTML += "\n📷 Câmera iniciada.";
        } catch (err) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream; await video.play(); cameraActive = true;
                toggleCameraBtn.textContent = "🔴 Desligar Câmera"; logArea.innerHTML += "\n📷 Câmera frontal iniciada.";
            } catch (e) { logArea.innerHTML += "\n❌ Erro na câmera. Use upload."; cameraActive = false; toggleCameraBtn.textContent = "🟢 Ligar Câmera"; }
        }
    }
    function desligarCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; video.srcObject = null; } cameraActive = false; toggleCameraBtn.textContent = "🟢 Ligar Câmera"; logArea.innerHTML += "\n📷 Câmera desligada."; }
    function toggleCamera() { cameraActive ? desligarCamera() : iniciarCamera(); }
    function capturarFoto() {
        if (!video.videoWidth || !cameraActive) { logArea.innerHTML += "\n⚠️ Câmera não ativa."; return; }
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        currentImageData = canvas.toDataURL('image/jpeg', 0.9);
        const img = new Image(); img.onload = () => { resultCanvas.width = img.width; resultCanvas.height = img.height; resultCanvas.getContext('2d').drawImage(img, 0, 0); };
        img.src = currentImageData; logArea.innerHTML += "\n📸 Foto capturada.";
    }
    function carregarUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            currentImageData = e.target.result;
            const img = new Image(); img.onload = () => { resultCanvas.width = img.width; resultCanvas.height = img.height; resultCanvas.getContext('2d').drawImage(img, 0, 0); };
            img.src = currentImageData; logArea.innerHTML += "\n📁 Imagem carregada.";
            if (stream && cameraActive) desligarCamera();
        };
        reader.readAsDataURL(file);
    }

    function gerarCartaoHTML(titulo, qtd, altCount) {
        let letrasUsadas = letras.slice(0, altCount);
        return `<div style="position: relative; font-family: Arial, sans-serif; background: white; padding: 20px; border: 1px solid #ccc;">
            <div class="marcador" style="position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; background: #000000; border: 1px solid #000000;"></div>
            <div class="marcador" style="position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; background: #000000; border: 1px solid #000000;"></div>
            <div class="marcador" style="position: absolute; bottom: 10px; left: 10px; width: 22px; height: 22px; background: #000000; border: 1px solid #000000;"></div>
            <div class="marcador" style="position: absolute; bottom: 10px; right: 10px; width: 22px; height: 22px; background: #000000; border: 1px solid #000000;"></div>
            <h2 style="text-align: center;">${titulo}</h2>
            <p><strong>NOME:</strong> _________________ &nbsp; <strong>DATA:</strong> ___/___/___ &nbsp; <strong>TURMA:</strong> _______</p>
            <p><strong>Total questões:</strong> ${qtd} &nbsp; | &nbsp; <strong>Alternativas:</strong> ${letrasUsadas.join(', ')}</p>
            <p><em>Instrução: PINTE COMPLETAMENTE a bolinha da alternativa com caneta AZUL ou PRETA.</em></p>
            <table style="border-collapse: collapse; width: 100%; border: 1px solid #000;">
                <thead><tr style="background:#eee;"><th style="border:1px solid #000; padding:10px;">Questão</th>${letrasUsadas.map(l => `<th style="border:1px solid #000; padding:10px;">${l}</th>`).join('')} </tr></thead>
                <tbody>${Array.from({length: qtd}, (_,i) => `<tr><td style="border:1px solid #000; text-align:center; padding:12px;">${i+1}</td>${letrasUsadas.map(() => `<td style="border:1px solid #000; text-align:center;"><span style="display:inline-block; width:28px; height:28px; border-radius:50%; border:2px solid black; background:white;"></span></td>`).join('')}</tr>`).join('')}</tbody>
            </table>
            <p style="font-size:12px; text-align:center;">Sistema de correção automática - mantenha os 4 cantos visíveis na foto.</p>
        </div>`;
    }
    function atualizarCartao() {
        let titulo = tituloProvaInput.value.trim() || "Avaliação";
        numQuestoes = parseInt(numQuestoesInput.value, 10); numAlternativas = parseInt(numAlternativasSelect.value, 10);
        if (isNaN(numQuestoes)) numQuestoes = 10;
        numQuestoes = Math.min(30, Math.max(1, numQuestoes));
        document.getElementById('printArea').innerHTML = gerarCartaoHTML(titulo, numQuestoes, numAlternativas);
        gerarInterfaceGabarito(); // cria os selects vazios
        // NÃO chama restaurarGabaritoExemplo automaticamente
        atualizarStatusGabarito();
    }
    function gerarInterfaceGabarito() {
        const container = document.getElementById('gabaritoDinamico'); container.innerHTML = '';
        const table = document.createElement('table'); table.className = 'gabarito-table';
        let letrasUsadas = letras.slice(0, numAlternativas);
        let thead = table.createTHead(); let headerRow = thead.insertRow(); headerRow.insertCell().innerText = 'Questão';
        for (let l of letrasUsadas) headerRow.insertCell().innerText = l;
        let tbody = table.createTBody();
        for (let i = 1; i <= numQuestoes; i++) {
            let row = tbody.insertRow(); row.insertCell().innerText = i;
            for (let alt of letrasUsadas) {
                let cell = row.insertCell(); let select = document.createElement('select');
                // Opção vazia selecionada por padrão
                select.innerHTML = `<option value="" selected>-</option>${letrasUsadas.map(a => `<option value="${a}">${a}</option>`).join('')}`;
                select.addEventListener('change', () => atualizarStatusGabarito()); cell.appendChild(select);
            }
        }
        container.appendChild(table);
        atualizarStatusGabarito();
    }
    function atualizarStatusGabarito() {
        const gabarito = obterGabaritoDaTela(); const preenchidas = Object.keys(gabarito).length; const faltam = numQuestoes - preenchidas;
        if (faltam === 0) gabaritoStatus.innerHTML = '<span style="color: #10b981;">✓ Todas preenchidas</span>';
        else gabaritoStatus.innerHTML = `<span style="color: #eab308;">⚠️ ${faltam} questão(ões) sem gabarito</span>`;
    }
    function obterGabaritoDaTela() {
        let gabarito = {};
        const linhas = document.querySelectorAll('#gabaritoDinamico table tbody tr');
        for (let i = 0; i < linhas.length; i++) {
            const selects = linhas[i].querySelectorAll('select');
            let respostaEncontrada = false;
            for (let select of selects) {
                let valor = select.value.trim();
                if (valor && valor !== "") { gabarito[i+1] = valor; respostaEncontrada = true; break; }
            }
            if (!respostaEncontrada) console.warn(`Questão ${i+1} sem gabarito`);
        }
        return gabarito;
    }
    // Função para restaurar exemplo cíclico (opcional)
    function restaurarGabaritoExemplo() {
        let letrasUsadas = letras.slice(0, numAlternativas);
        const selects = document.querySelectorAll('#gabaritoDinamico select');
        selects.forEach((select, index) => {
            let questao = Math.floor(index / numAlternativas) + 1;
            select.value = letrasUsadas[(questao-1) % letrasUsadas.length];
        });
        atualizarStatusGabarito();
        logArea.innerHTML += "\n🔄 Gabarito exemplo cíclico carregado.";
    }
    function validarPreenchimentoGabarito() {
        const gabarito = obterGabaritoDaTela(); const faltando = [];
        for (let i = 1; i <= numQuestoes; i++) if (!gabarito[i]) faltando.push(i);
        if (faltando.length) alert(`⚠️ Faltam questões: ${faltando.join(', ')}`);
        else alert(`✓ Gabarito completo!`);
        return faltando.length === 0;
    }

    // ----- DETECÇÃO DE MARCADORES (retorna posições) -----
    function encontrarMarcadores(gray) {
        let thresh = new cv.Mat(); cv.threshold(gray, thresh, 200, 255, cv.THRESH_BINARY_INV);
        let contours = new cv.MatVector(), hierarchy = new cv.Mat();
        cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
        let marcadores = [];
        for (let i = 0; i < contours.size(); i++) {
            let cnt = contours.get(i); let rect = cv.boundingRect(cnt); let area = rect.width * rect.height;
            if (area > 300 && area < 5000) {
                let ratio = rect.width / rect.height;
                if (ratio > 0.7 && ratio < 1.3) marcadores.push({ x: rect.x, y: rect.y, w: rect.width, h: rect.height, centerX: rect.x + rect.width/2, centerY: rect.y + rect.height/2 });
            }
            cnt.delete();
        }
        thresh.delete(); contours.delete(); hierarchy.delete();
        if (marcadores.length >= 4) {
            marcadores.sort((a,b) => a.centerY - b.centerY);
            let top = marcadores.slice(0,2).sort((a,b)=>a.centerX - b.centerX);
            let bottom = marcadores.slice(2,4).sort((a,b)=>a.centerX - b.centerX);
            if (top.length===2 && bottom.length===2) return [top[0], top[1], bottom[0], bottom[1]];
        }
        return marcadores.slice(0,4);
    }
    function aplicarPerspectiva(src, marcadores) {
        if (marcadores.length !== 4) return src.clone();
        let ptsSrc = cv.matFromArray(4,1,cv.CV_32FC2, [ marcadores[0].centerX,marcadores[0].centerY, marcadores[1].centerX,marcadores[1].centerY, marcadores[2].centerX,marcadores[2].centerY, marcadores[3].centerX,marcadores[3].centerY ]);
        let width = src.cols, height = src.rows;
        let ptsDst = cv.matFromArray(4,1,cv.CV_32FC2, [0,0, width,0, 0,height, width,height]);
        let M = cv.getPerspectiveTransform(ptsSrc, ptsDst); let dst = new cv.Mat();
        cv.warpPerspective(src, dst, M, new cv.Size(width, height), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255,255,255));
        ptsSrc.delete(); ptsDst.delete(); M.delete(); return dst;
    }
    function equalizarContraste(gray) { let eq = new cv.Mat(); cv.equalizeHist(gray, eq); return eq; }
    function deskewImage(srcMat) {
        let gray = new cv.Mat(); cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
        let edges = new cv.Mat(); cv.Canny(gray, edges, 50, 150, 3);
        let lines = new cv.Mat(); cv.HoughLines(edges, lines, 1, Math.PI/180, 100);
        let angles = [];
        for (let i = 0; i < lines.rows; i++) { let theta = lines.data32F[i*2+1]; let angle = theta * 180 / Math.PI; if (angle < 45 || angle > 135) angles.push(angle); }
        let medianAngle = 0; if (angles.length) { angles.sort((a,b)=>a-b); medianAngle = angles[Math.floor(angles.length/2)]; }
        let rotation = medianAngle - 90;
        if (Math.abs(rotation) < 2) return srcMat.clone();
        let center = new cv.Point(srcMat.cols/2, srcMat.rows/2);
        let rotMat = cv.getRotationMatrix2D(center, rotation, 1.0); let dst = new cv.Mat();
        cv.warpAffine(srcMat, dst, rotMat, new cv.Size(srcMat.cols, srcMat.rows), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255,255,255));
        gray.delete(); edges.delete(); lines.delete(); rotMat.delete(); return dst;
    }

    async function detectarRespostasComPontos(imageBase64) {
        return new Promise((resolve, reject) => {
            if (!cvReady) reject("OpenCV não carregado.");
            let img = new Image();
            img.onload = () => {
                try {
                    let src = cv.imread(img); let gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                    let marcadores = encontrarMarcadores(gray);
                    let corrigiuPerspectiva = false;
                    if (marcadores.length === 4) {
                        logArea.innerHTML += "\n🔲 4 marcadores detectados! Aplicando perspectiva...";
                        let srcWarp = aplicarPerspectiva(src, marcadores); src.delete(); src = srcWarp;
                        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0); corrigiuPerspectiva = true;
                    } else { logArea.innerHTML += `\n⚠️ Marcadores insuficientes (${marcadores.length}/4). Fallback deskew.`; let deskewed = deskewImage(src); src.delete(); src = deskewed; cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0); }
                    let grayEq = equalizarContraste(gray); gray.delete(); gray = grayEq;
                    let circles = new cv.Mat();
                    cv.HoughCircles(gray, circles, cv.HOUGH_GRADIENT, 1, 30, 100, 30, 8, 25);
                    if (circles.cols === 0) { src.delete(); gray.delete(); circles.delete(); reject("Nenhum círculo detectado."); return; }
                    let circleData = [];
                    for (let i = 0; i < circles.cols; i++) { let x = circles.data32F[i*3]; let y = circles.data32F[i*3+1]; let r = circles.data32F[i*3+2]; circleData.push({ x, y, r }); }
                    circleData.sort((a,b) => a.y - b.y);
                    let rows = [], thresholdY = 25;
                    for (let c of circleData) {
                        let added = false;
                        for (let row of rows) { if (Math.abs(row.avgY - c.y) < thresholdY) { row.circles.push(c); row.avgY = (row.avgY * (row.circles.length-1) + c.y) / row.circles.length; added = true; break; } }
                        if (!added) rows.push({ avgY: c.y, circles: [c] });
                    }
                    for (let row of rows) row.circles.sort((a,b) => a.x - b.x);
                    let validRows = rows.filter(row => Math.abs(row.circles.length - numAlternativas) <= 1);
                    if (validRows.length < numQuestoes - 2 || validRows.length > numQuestoes + 2) { src.delete(); gray.delete(); circles.delete(); reject(`Detectadas ${validRows.length} linhas, esperado ~${numQuestoes}.`); return; }
                    let questoesLinhas = validRows.slice(0, numQuestoes);
                    let respostas = {}, circlesPositions = {};
                    for (let idx = 0; idx < questoesLinhas.length; idx++) {
                        let row = questoesLinhas[idx]; let circlesRow = row.circles.slice(0, numAlternativas);
                        circlesPositions[idx+1] = {};
                        for (let j = 0; j < circlesRow.length; j++) {
                            let circ = circlesRow[j]; let altLetra = letras[j];
                            circlesPositions[idx+1][altLetra] = { x: circ.x, y: circ.y, r: circ.r };
                            let mask = new cv.Mat.zeros(gray.rows, gray.cols, cv.CV_8UC1);
                            cv.circle(mask, new cv.Point(circ.x, circ.y), circ.r-3, new cv.Scalar(255), -1);
                            let mean = new cv.Mat(); cv.mean(gray, mask, mean);
                            let intensidade = mean.data64F[0]; mask.delete(); mean.delete();
                            let limiar = (intensidade < 80) ? 140 : 110;
                            if (intensidade < limiar) { if (!respostas[idx+1] || intensidade < (respostas[idx+1].intens || 255)) respostas[idx+1] = { alt: altLetra, intens: intensidade }; }
                        }
                    }
                    src.delete(); gray.delete(); circles.delete();
                    resolve({ respostas: Object.fromEntries(Object.entries(respostas).map(([k,v]) => [k, v.alt])), circlesPositions, perspectivaAplicada: corrigiuPerspectiva, marcadoresPositions: marcadores });
                } catch (err) { reject("Erro: " + err.message); }
            };
            img.src = imageBase64;
        });
    }

    async function executarCorrecao() {
        if (!currentImageData) { logArea.innerHTML += "\n⚠️ Nenhuma imagem."; return; }
        const gabarito = obterGabaritoDaTela();
        if (Object.keys(gabarito).length === 0) { alert("❌ Defina o gabarito oficial!"); return; }
        if (!cvReady) { logArea.innerHTML += "\n⏳ OpenCV carregando..."; return; }
        logArea.innerHTML += "\n🔍 Processando imagem...";
        try {
            const { respostas: respostasAluno, circlesPositions, perspectivaAplicada, marcadoresPositions } = await detectarRespostasComPontos(currentImageData);
            logArea.innerHTML += `\n📝 Respostas detectadas: ${JSON.stringify(respostasAluno)}`;
            if (perspectivaAplicada) logArea.innerHTML += "\n✅ Perspectiva aplicada.";
            let img = new Image();
            img.onload = () => {
                resultCanvas.width = img.width; resultCanvas.height = img.height;
                let ctx = resultCanvas.getContext('2d'); ctx.drawImage(img, 0, 0);
                let acertos = 0, detalhes = [], estatisticas = { corretas: [], erradas: [], naoDetectadas: [] };
                for (let i = 1; i <= numQuestoes; i++) {
                    let correta = gabarito[i], aluno = respostasAluno[i];
                    if (correta && aluno && correta.trim() === aluno.trim()) {
                        acertos++; detalhes.push(`✅ Q${i}: ${aluno}`); estatisticas.corretas.push(i);
                        if (circlesPositions[i] && circlesPositions[i][aluno]) {
                            let pos = circlesPositions[i][aluno];
                            ctx.beginPath(); ctx.arc(pos.x, pos.y, pos.r+4, 0, 2*Math.PI); ctx.fillStyle = '#adff2f'; ctx.fill(); ctx.strokeStyle = '#006400'; ctx.lineWidth = 2; ctx.stroke();
                            // Ponto verde central
                            ctx.beginPath(); ctx.arc(pos.x, pos.y, pos.r*0.3, 0, 2*Math.PI); ctx.fillStyle = '#00FF00'; ctx.fill();
                        }
                    } else if (correta && aluno) {
                        detalhes.push(`❌ Q${i}: ${aluno} (gabarito ${correta})`); estatisticas.erradas.push(i);
                        if (circlesPositions[i] && circlesPositions[i][aluno]) {
                            let pos = circlesPositions[i][aluno];
                            ctx.beginPath(); ctx.arc(pos.x, pos.y, pos.r+4, 0, 2*Math.PI); ctx.fillStyle = '#ffcccc'; ctx.fill(); ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2; ctx.stroke();
                        }
                    } else if (correta && !aluno) { detalhes.push(`⚠️ Q${i}: não detectado (gabarito ${correta})`); estatisticas.naoDetectadas.push(i); }
                }
                // ----- DESENHAR MARCADORES AMARELOS E RETÂNGULO VERDE -----
                if (marcadoresPositions && marcadoresPositions.length === 4) {
                    // Desenhar os quatro pontos amarelos
                    for (let m of marcadoresPositions) {
                        ctx.beginPath(); ctx.arc(m.centerX, m.centerY, 12, 0, 2*Math.PI);
                        ctx.fillStyle = '#FFD700'; ctx.fill(); ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 2; ctx.stroke();
                    }
                    // Desenhar o retângulo verde (conectando os cantos na ordem correta)
                    ctx.beginPath();
                    ctx.moveTo(marcadoresPositions[0].centerX, marcadoresPositions[0].centerY);
                    ctx.lineTo(marcadoresPositions[1].centerX, marcadoresPositions[1].centerY);
                    ctx.lineTo(marcadoresPositions[3].centerX, marcadoresPositions[3].centerY);
                    ctx.lineTo(marcadoresPositions[2].centerX, marcadoresPositions[2].centerY);
                    ctx.closePath();
                    ctx.strokeStyle = '#00FF00'; ctx.lineWidth = 3; ctx.stroke();
                    logArea.innerHTML += "\n🟡 Pontos amarelos e retângulo verde desenhados!";
                } else { logArea.innerHTML += "\n⚠️ Não foi possível desenhar os cantos (marcadores insuficientes)."; }

                let nota = (acertos / numQuestoes) * 10, percentual = (acertos / numQuestoes) * 100;
                scoreDisplay.innerText = `${acertos}/${numQuestoes}`;
                gradeDetail.innerHTML = `🎓 NOTA: ${nota.toFixed(1)} (${percentual.toFixed(1)}%)<br>${acertos} acerto${acertos!==1?'s':''}`;
                statsArea.innerHTML = `<div class="stat-item"><div class="stat-value" style="color:#10b981;">${estatisticas.corretas.length}</div><div class="stat-label">Acertos</div></div>
                    <div class="stat-item"><div class="stat-value" style="color:#ef4444;">${estatisticas.erradas.length}</div><div class="stat-label">Erros</div></div>
                    <div class="stat-item"><div class="stat-value" style="color:#eab308;">${estatisticas.naoDetectadas.length}</div><div class="stat-label">Não detectadas</div></div>
                    <div class="stat-item"><div class="stat-value">${nota.toFixed(1)}</div><div class="stat-label">Nota (0-10)</div></div>`;
                resultArea.style.display = 'block';
                logArea.innerHTML += `\n📊 CORREÇÃO:\n${detalhes.join('\n')}\n🎉 Total de acertos: ${acertos}/${numQuestoes}`;
                ultimaCorrecao = { data: new Date().toLocaleString(), titulo: tituloProvaInput.value, totalQuestoes: numQuestoes, totalAlternativas: numAlternativas, acertos, nota: nota.toFixed(1), percentual: percentual.toFixed(1), detalhes, respostasAluno, gabarito, estatisticas };
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            };
            img.src = currentImageData;
        } catch (err) { logArea.innerHTML += `\n❌ Erro: ${err}`; alert(`Erro: ${err}\n\nTente melhor iluminação e enquadramento.`); }
    }

    function exportarJSON() { if (!ultimaCorrecao) { alert("Nenhuma correção."); return; } const dataStr = JSON.stringify(ultimaCorrecao, null, 2); const blob = new Blob([dataStr], {type:"application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `correcao_${new Date().toISOString().slice(0,19)}.json`; a.click(); URL.revokeObjectURL(blob); logArea.innerHTML += "\n📄 JSON exportado."; }
    function exportarCSV() { if (!ultimaCorrecao) { alert("Nenhuma correção."); return; } let csvRows = [["Questão","Gabarito","Resposta Aluno","Resultado"]]; for (let i=1;i<=numQuestoes;i++) { let gab = ultimaCorrecao.gabarito[i] || "-"; let resp = ultimaCorrecao.respostasAluno[i] || "-"; let res = (gab === resp) ? "Acertou" : (resp !== "-" ? "Errou" : "Não detectado"); csvRows.push([i, gab, resp, res]); } csvRows.push(["","","",""],["Total Acertos",ultimaCorrecao.acertos,"",""],["Total Questões",ultimaCorrecao.totalQuestoes,"",""],["Nota",ultimaCorrecao.nota,"",""],["Percentual",ultimaCorrecao.percentual+"%","",""],["Data",ultimaCorrecao.data,"",""]); const csvContent = csvRows.map(row => row.map(cell => `"${cell}"`).join(",")).join("\n"); const blob = new Blob(["\uFEFF"+csvContent], {type:"text/csv;charset=utf-8;"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `correcao_${new Date().toISOString().slice(0,19)}.csv`; a.click(); URL.revokeObjectURL(blob); logArea.innerHTML += "\n📊 CSV exportado."; }

    captureBtn.addEventListener('click', capturarFoto); toggleCameraBtn.addEventListener('click', toggleCamera);
    fileUpload.addEventListener('change', (e) => { if(e.target.files[0]) carregarUpload(e.target.files[0]); });
    corrigirBtn.addEventListener('click', executarCorrecao); resetGabaritoBtn.addEventListener('click', restaurarGabaritoExemplo);
    validarGabaritoBtn.addEventListener('click', validarPreenchimentoGabarito);
    btnAplicarConfig.addEventListener('click', () => { atualizarCartao(); logArea.innerHTML += "\n⚙️ Configurações aplicadas."; });
    btnImprimirCartao.addEventListener('click', () => { let conteudo = document.getElementById('printArea').innerHTML; let win = window.open('', '_blank'); win.document.write(`<html><head><title>Cartão de Respostas</title><style>@media print{ body{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;} .marcador{background:#000 !important;} } .marcador{width:22px;height:22px;background:#000;border:1px solid #000;} body{margin:0;padding:20px;}</style></head><body>${conteudo}</body></html>`); win.document.close(); win.print(); });
    btnExportarJSON.addEventListener('click', exportarJSON); btnExportarCSV.addEventListener('click', exportarCSV);
    iniciarCamera(); atualizarCartao();
</script>
