<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Gabarito Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 30px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }

        #imageInput {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .preview-container {
            margin-top: 20px;
            text-align: center;
        }

        #preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .gabarito-config {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
        }

        .questions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .questions-table th,
        .questions-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .questions-table th {
            background: #667eea;
            color: white;
        }

        .questions-table tr:hover {
            background: #f5f5f5;
        }

        .correct {
            color: green;
            font-weight: bold;
        }

        .incorrect {
            color: red;
            font-weight: bold;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .export-buttons button {
            background: #28a745;
        }

        .export-buttons button:last-child {
            background: #17a2b8;
        }

        @media print {
            .upload-area, .gabarito-config, .export-buttons, button {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Leitor de Gabarito Online</h1>
        <p class="subtitle">Upload da imagem do cartão-resposta para correção automática</p>

        <div class="main-content">
            <div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <p>Clique ou arraste uma imagem aqui</p>
                    <p style="font-size: 12px; color: #666; margin-top: 10px;">Formatos: JPG, PNG, GIF</p>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                <div class="preview-container">
                    <img id="preview" style="display: none;">
                </div>
            </div>

            <div>
                <div class="gabarito-config">
                    <h3 style="margin-bottom: 15px;">Configurações</h3>
                    <div class="form-group">
                        <label>Número de Questões:</label>
                        <input type="number" id="numQuestoes" value="10" min="1" max="100">
                    </div>
                    <div class="form-group">
                        <label>Alternativas:</label>
                        <input type="text" id="alternativas" value="A,B,C,D,E" placeholder="Ex: A,B,C,D,E">
                    </div>
                    <div class="form-group">
                        <label>Gabarito Oficial:</label>
                        <input type="text" id="gabarito" placeholder="Ex: A,B,C,D,E,A,B,C,D,E">
                    </div>
                    <button onclick="processarGabarito()">🔍 Corrigir Prova</button>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">Processando imagem...</p>
        </div>

        <div class="results" id="results">
            <h2>📊 Resultado da Correção</h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        let imagemAtual = null;

        // Upload de imagem
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');

        uploadArea.addEventListener('click', () => {
            imageInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                processImage(file);
            }
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                processImage(e.target.files[0]);
            }
        });

        function processImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagemAtual = e.target.result;
                preview.src = imagemAtual;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        async function processarGabarito() {
            if (!imagemAtual) {
                alert('Por favor, selecione uma imagem primeiro!');
                return;
            }

            const numQuestoes = parseInt(document.getElementById('numQuestoes').value);
            const alternativasStr = document.getElementById('alternativas').value;
            let gabaritoStr = document.getElementById('gabarito').value;

            const alternativas = alternativasStr.split(',').map(a => a.trim().toUpperCase());

            // Se gabarito não foi preenchido, gerar aleatório
            if (!gabaritoStr) {
                gabaritoStr = gerarGabaritoAleatorio(numQuestoes, alternativas);
                document.getElementById('gabarito').value = gabaritoStr;
            }

            const gabarito = gabaritoStr.split(',').map(a => a.trim().toUpperCase());

            if (gabarito.length !== numQuestoes) {
                alert(`O gabarito deve ter ${numQuestoes} alternativas!`);
                return;
            }

            // Mostrar loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            try {
                // Processar imagem com Tesseract.js
                const { data: { text } } = await Tesseract.recognize(
                    imagemAtual,
                    'por',
                    {
                        logger: m => console.log(m)
                    }
                );

                // Extrair respostas do texto
                const respostasAluno = extrairRespostas(text, numQuestoes, alternativas);
                
                // Corrigir prova
                const resultado = corrigirProva(respostasAluno, gabarito);
                
                // Exibir resultados
                exibirResultados(resultado, respostasAluno, gabarito);
                
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao processar a imagem. Tente novamente com uma imagem mais nítida.');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function extrairRespostas(texto, numQuestoes, alternativas) {
            // Limpar texto
            texto = texto.toUpperCase();
            
            // Procurar padrões como "1A", "2B", "01C", etc.
            const respostas = [];
            const padrao = /(\d+)\s*([A-E])/g;
            let match;
            const encontrados = {};

            while ((match = padrao.exec(texto)) !== null) {
                const numQuestao = parseInt(match[1]);
                const resposta = match[2];
                if (numQuestao >= 1 && numQuestao <= numQuestoes && alternativas.includes(resposta)) {
                    encontrados[numQuestao] = resposta;
                }
            }

            // Preencher array de respostas
            for (let i = 1; i <= numQuestoes; i++) {
                respostas.push(encontrados[i] || null);
            }

            return respostas;
        }

        function corrigirProva(respostasAluno, gabarito) {
            let acertos = 0;
            const detalhes = [];

            for (let i = 0; i < respostasAluno.length; i++) {
                const aluno = respostasAluno[i];
                const correto = gabarito[i];
                const acertou = aluno && aluno === correto;
                
                if (acertou) acertos++;
                
                detalhes.push({
                    questao: i + 1,
                    respostaAluno: aluno || 'Não respondida',
                    respostaCorreta: correto,
                    status: acertou ? 'Correta' : (aluno ? 'Incorreta' : 'Não respondida'),
                    acertou: acertou
                });
            }

            const nota = (acertos / gabarito.length) * 100;

            return {
                totalQuestoes: gabarito.length,
                acertos: acertos,
                nota: nota.toFixed(1),
                detalhes: detalhes
            };
        }

        function exibirResultados(resultado, respostasAluno, gabarito) {
            const resultContent = document.getElementById('resultContent');
            
            let html = `
                <div class="score-card">
                    <h3>Nota Final</h3>
                    <div class="score">${resultado.nota}%</div>
                    <p>${resultado.acertos} acertos de ${resultado.totalQuestoes} questões</p>
                </div>
                
                <table class="questions-table">
                    <thead>
                        <tr>
                            <th>Questão</th>
                            <th>Sua Resposta</th>
                            <th>Gabarito</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const detalhe of resultado.detalhes) {
                const statusClass = detalhe.acertou ? 'correct' : 'incorrect';
                const statusIcon = detalhe.acertou ? '✓' : '✗';
                html += `
                    <tr>
                        <td>${detalhe.questao}</td>
                        <td>${detalhe.respostaAluno}</td>
                        <td>${detalhe.respostaCorreta}</td>
                        <td class="${statusClass}">${statusIcon} ${detalhe.status}</td>
                    </tr>
                `;
            }

            html += `
                    </tbody>
                </table>
                
                <div class="export-buttons">
                    <button onclick="exportarExcel()">📊 Exportar para Excel</button>
                    <button onclick="window.print()">🖨️ Imprimir Relatório</button>
                </div>
            `;

            resultContent.innerHTML = html;
            document.getElementById('results').style.display = 'block';
            
            // Salvar resultado para exportação
            window.resultadoAtual = resultado;
        }

        function gerarGabaritoAleatorio(numQuestoes, alternativas) {
            const gabarito = [];
            for (let i = 0; i < numQuestoes; i++) {
                const randomIndex = Math.floor(Math.random() * alternativas.length);
                gabarito.push(alternativas[randomIndex]);
            }
            return gabarito.join(',');
        }

        function exportarExcel() {
            if (!window.resultadoAtual) return;
            
            const dados = window.resultadoAtual.detalhes.map(d => ({
                'Questão': d.questao,
                'Sua Resposta': d.respostaAluno,
                'Resposta Correta': d.respostaCorreta,
                'Status': d.status
            }));
            
            // Adicionar linha de resumo
            dados.push({
                'Questão': 'RESUMO',
                'Sua Resposta': `Total: ${window.resultadoAtual.totalQuestoes}`,
                'Resposta Correta': `Acertos: ${window.resultadoAtual.acertos}`,
                'Status': `Nota: ${window.resultadoAtual.nota}%`
            });
            
            const ws = XLSX.utils.json_to_sheet(dados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Resultado Gabarito');
            XLSX.writeFile(wb, `gabarito_${new Date().toISOString().slice(0,19)}.xlsx`);
        }

        // Preencher exemplo de gabarito
        function preencherExemplo() {
            const numQuestoes = 10;
            const alternativas = ['A', 'B', 'C', 'D', 'E'];
            const exemplo = gerarGabaritoAleatorio(numQuestoes, alternativas);
            document.getElementById('gabarito').value = exemplo;
        }

        // Inicializar com exemplo
        preencherExemplo();
    </script>
</body>
</html>
