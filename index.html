<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Corretor de Provas - Bolinhas com Indicadores Visuais</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            background: #eef2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #0f172a;
        }
        .config-panel {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            align-items: flex-end;
            border: 1px solid #e2e8f0;
        }
        .config-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .config-item label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
        }
        .config-item input, .config-item select {
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            background: white;
        }
        button {
            background: #3b82f6;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background: #2563eb;
            transform: scale(0.97);
        }
        .btn-green {
            background: #10b981;
        }
        .btn-green:hover {
            background: #059669;
        }
        .btn-secondary {
            background: #475569;
        }
        .btn-warning {
            background: #eab308;
            color: #1e293b;
        }
        .two-columns {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 20px;
        }
        .column {
            flex: 1;
            min-width: 300px;
        }
        .card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 18px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        .section-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        video, #imagePreview {
            width: 100%;
            border-radius: 20px;
            background: #0f172a;
            border: 2px solid #cbd5e1;
            max-height: 320px;
            object-fit: contain;
        }
        .canvas-container {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        #resultCanvas {
            width: 100%;
            border-radius: 20px;
            border: 2px solid #cbd5e1;
            background: #0f172a;
        }
        .gabarito-grid {
            background: white;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            overflow-x: auto;
        }
        .gabarito-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .gabarito-table th, .gabarito-table td {
            border: 1px solid #cbd5e1;
            padding: 8px 4px;
            text-align: center;
        }
        .gabarito-table select {
            padding: 5px;
            border-radius: 20px;
            border: 1px solid #94a3b8;
            background: white;
        }
        .result-area {
            background: #eef2ff;
            border-radius: 24px;
            padding: 18px;
            text-align: center;
            margin-top: 20px;
        }
        .score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1e40af;
        }
        .log {
            background: #1e293b;
            color: #cbd5e6;
            border-radius: 20px;
            padding: 14px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .container { padding: 0; box-shadow: none; }
            .no-print { display: none !important; }
            .print-area { margin: 0; padding: 0.5cm; }
        }
    </style>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
</head>
<body>
<div class="container">
    <h1>📋 Corretor Inteligente com Pontos Verdes</h1>

    <!-- Painel de configuração -->
    <div class="config-panel no-print">
        <div class="config-item">
            <label>✏️ Título da Prova</label>
            <input type="text" id="tituloProva" placeholder="Ex: Avaliação de Matemática" value="Avaliação">
        </div>
        <div class="config-item">
            <label>🔢 Número de questões</label>
            <input type="number" id="numQuestoes" min="1" max="30" value="10" style="width: 80px;">
        </div>
        <div class="config-item">
            <label>🔤 Alternativas</label>
            <select id="numAlternativas">
                <option value="2">2 (A,B)</option><option value="3">3 (A,B,C)</option>
                <option value="4">4 (A,B,C,D)</option><option value="5" selected>5 (A,B,C,D,E)</option>
                <option value="6">6 (A,B,C,D,E,F)</option>
            </select>
        </div>
        <div class="config-item">
            <button id="btnAplicarConfig" class="btn-green">Aplicar e gerar cartão</button>
        </div>
    </div>

    <!-- Área do cartão (para imprimir) -->
    <div id="printArea" class="print-area" style="background: white; padding: 20px; border-radius: 16px; margin-bottom: 25px;"></div>
    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button id="btnImprimirCartao">🖨️ Imprimir cartão</button>
    </div>

    <!-- Colunas para correção -->
    <div class="two-columns no-print">
        <div class="column">
            <div class="card">
                <div class="section-title">📸 Capturar cartão preenchido</div>
                <video id="video" autoplay playsinline style="width:100%; border-radius: 20px;"></video>
                <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;">
                    <button id="captureBtn">📷 Tirar Foto</button>
                    <button id="toggleCameraBtn" class="btn-warning">🔴 Desligar Câmera</button>
                    <label for="fileUpload" style="background:#475569; padding:10px 18px; border-radius:60px; color:white; cursor:pointer;">📁 Enviar Imagem</label>
                    <input type="file" id="fileUpload" accept="image/jpeg,image/png" style="display:none;">
                </div>
                <canvas id="canvas" style="display:none;"></canvas>
                <div id="previewArea" style="margin-top: 15px;">
                    <canvas id="resultCanvas" style="width:100%; border-radius: 20px;"></canvas>
                </div>
            </div>
        </div>
        <div class="column">
            <div class="card">
                <div class="section-title">✅ Gabarito Oficial</div>
                <div id="gabaritoDinamico" class="gabarito-grid"></div>
                <button id="resetGabaritoBtn" class="btn-secondary" style="margin-top: 16px;">Restaurar exemplo (primeira alternativa)</button>
            </div>
            <button id="corrigirBtn" class="btn-green" style="width:100%; font-size:1.2rem;">✨ CORRIGIR PROVA</button>
            <div id="resultArea" class="result-area" style="display:none;">
                <div>🎯 ACERTOS</div>
                <div class="score" id="scoreDisplay">0/0</div>
                <div id="gradeDetail"></div>
            </div>
        </div>
    </div>

    <div class="log no-print" id="logArea">
        📌 Configure o gabarito, tire uma foto e clique em CORRIGIR. Os acertos aparecerão como pontos verdes limão na imagem.
    </div>
</div>

<script>
    // ----------------------------- ESTADO GLOBAL -----------------------------
    let currentImageData = null;       // imagem original base64
    let gabarito = {};                 // {1: "A", 2: "B", ...}
    let numQuestoes = 10;
    let numAlternativas = 5;
    let letras = ['A','B','C','D','E','F'];
    let cvReady = false;
    let cameraActive = true;
    let stream = null;

    // Elementos DOM
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const fileUpload = document.getElementById('fileUpload');
    const resultCanvas = document.getElementById('resultCanvas');
    const corrigirBtn = document.getElementById('corrigirBtn');
    const resultArea = document.getElementById('resultArea');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const gradeDetail = document.getElementById('gradeDetail');
    const logArea = document.getElementById('logArea');
    const resetGabaritoBtn = document.getElementById('resetGabaritoBtn');
    const btnAplicarConfig = document.getElementById('btnAplicarConfig');
    const btnImprimirCartao = document.getElementById('btnImprimirCartao');
    const tituloProvaInput = document.getElementById('tituloProva');
    const numQuestoesInput = document.getElementById('numQuestoes');
    const numAlternativasSelect = document.getElementById('numAlternativas');

    // OpenCV inicialização
    function onOpenCvReady() {
        cvReady = true;
        logArea.innerHTML += "\n✅ OpenCV.js carregado!";
    }
    if (typeof cv !== 'undefined') {
        cv['onRuntimeInitialized'] = onOpenCvReady;
    } else {
        setTimeout(() => { if (typeof cv !== 'undefined') cv['onRuntimeInitialized'] = onOpenCvReady; }, 1000);
    }

    // ----------------------------- CÂMERA (Ligar/Desligar) -----------------------------
    async function iniciarCamera() {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        }
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
            video.srcObject = stream;
            await video.play();
            cameraActive = true;
            toggleCameraBtn.textContent = "🔴 Desligar Câmera";
            logArea.innerHTML += "\n📷 Câmera ligada.";
        } catch (err) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await video.play();
                cameraActive = true;
                toggleCameraBtn.textContent = "🔴 Desligar Câmera";
            } catch (e) {
                logArea.innerHTML += "\n❌ Erro ao acessar câmera.";
                cameraActive = false;
                toggleCameraBtn.textContent = "🟢 Ligar Câmera";
            }
        }
    }

    function desligarCamera() {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
            video.srcObject = null;
        }
        cameraActive = false;
        toggleCameraBtn.textContent = "🟢 Ligar Câmera";
        logArea.innerHTML += "\n📴 Câmera desligada.";
    }

    function toggleCamera() {
        if (cameraActive) {
            desligarCamera();
        } else {
            iniciarCamera();
        }
    }

    function capturarFoto() {
        if (!video.videoWidth || !cameraActive) {
            logArea.innerHTML += "\n⚠️ Câmera não está ativa ou não pronta. Ligue a câmera primeiro.";
            return;
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        currentImageData = canvas.toDataURL('image/jpeg', 0.9);
        // Exibir a imagem original no canvas de resultado
        const img = new Image();
        img.onload = () => {
            resultCanvas.width = img.width;
            resultCanvas.height = img.height;
            const ctx = resultCanvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
        };
        img.src = currentImageData;
        logArea.innerHTML += "\n📸 Foto capturada. Agora defina o gabarito e clique em CORRIGIR.";
    }

    function carregarUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            currentImageData = e.target.result;
            const img = new Image();
            img.onload = () => {
                resultCanvas.width = img.width;
                resultCanvas.height = img.height;
                const ctx = resultCanvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
            };
            img.src = currentImageData;
            logArea.innerHTML += "\n📁 Imagem carregada.";
            if (stream && cameraActive) desligarCamera();
        };
        reader.readAsDataURL(file);
    }

    // ----------------------------- GERAR CARTÃO -----------------------------
    function gerarCartaoHTML(titulo, qtd, altCount) {
        let letrasUsadas = letras.slice(0, altCount);
        return `<div style="font-family: Arial, sans-serif;">
            <h2 style="text-align: center;">${titulo}</h2>
            <p><strong>NOME:</strong> _________________ &nbsp; <strong>DATA:</strong> ___/___/___ &nbsp; <strong>TURMA:</strong> _______</p>
            <p><strong>Total questões:</strong> ${qtd} &nbsp; | &nbsp; <strong>Alternativas:</strong> ${letrasUsadas.join(', ')}</p>
            <p><em>Instrução: PINTE COMPLETAMENTE a bolinha da alternativa com caneta AZUL ou PRETA.</em></p>
            <table style="border-collapse: collapse; width: 100%; border: 1px solid #000;">
                <thead><tr style="background:#eee;"><th style="border:1px solid #000; padding:10px;">Questão</th>${letrasUsadas.map(l => `<th style="border:1px solid #000; padding:10px;">${l}</th>`).join('')}</tr></thead>
                <tbody>${Array.from({length: qtd}, (_,i) => `<tr><td style="border:1px solid #000; text-align:center; padding:12px;">${i+1}</td>${letrasUsadas.map(() => `<td style="border:1px solid #000; text-align:center;"><span class="bolinha-print" style="display:inline-block; width:28px; height:28px; border-radius:50%; border:2px solid black; background:white;"></span></td>`).join('')}</tr>`).join('')}</tbody>
            </table>
            <p style="font-size:12px; text-align:center;">Sistema de correção automática - fotografe esta folha preenchida.</p>
        </div>`;
    }

    function atualizarCartao() {
        let titulo = tituloProvaInput.value.trim() || "Avaliação";
        numQuestoes = parseInt(numQuestoesInput.value, 10);
        numAlternativas = parseInt(numAlternativasSelect.value, 10);
        if (isNaN(numQuestoes)) numQuestoes = 10;
        numQuestoes = Math.min(30, Math.max(1, numQuestoes));
        letras = ['A','B','C','D','E','F'];
        document.getElementById('printArea').innerHTML = gerarCartaoHTML(titulo, numQuestoes, numAlternativas);
        gerarInterfaceGabarito();
    }

    // ----------------------------- GABARITO -----------------------------
    function gerarInterfaceGabarito() {
        const container = document.getElementById('gabaritoDinamico');
        container.innerHTML = '';
        const table = document.createElement('table');
        table.className = 'gabarito-table';
        let letrasUsadas = letras.slice(0, numAlternativas);
        let thead = table.createTHead();
        let headerRow = thead.insertRow();
        headerRow.insertCell().innerText = 'Questão';
        for (let l of letrasUsadas) headerRow.insertCell().innerText = l;
        let tbody = table.createTBody();
        for (let i = 1; i <= numQuestoes; i++) {
            let row = tbody.insertRow();
            row.insertCell().innerText = i;
            for (let alt of letrasUsadas) {
                let cell = row.insertCell();
                let select = document.createElement('select');
                select.innerHTML = `<option value="">-</option>${letrasUsadas.map(a => `<option value="${a}" ${gabarito[i] === a ? 'selected' : ''}>${a}</option>`).join('')}`;
                select.addEventListener('change', (e) => {
                    if (e.target.value) gabarito[i] = e.target.value;
                    else delete gabarito[i];
                    // Persistir visualmente
                    logArea.innerHTML += `\n✅ Gabarito Q${i} = ${gabarito[i] || 'não definido'}`;
                });
                cell.appendChild(select);
            }
        }
        container.appendChild(table);
    }

    function restaurarGabaritoExemplo() {
        let letrasUsadas = letras.slice(0, numAlternativas);
        for (let i = 1; i <= numQuestoes; i++) {
            gabarito[i] = letrasUsadas[(i-1) % letrasUsadas.length];
        }
        gerarInterfaceGabarito();
        logArea.innerHTML += "\n🔄 Gabarito exemplo carregado (primeira alternativa cíclica).";
    }

    // ----------------------------- DETECÇÃO E DESENHO DOS PONTOS VERDES -----------------------------
    async function detectarRespostasComPontos(imageBase64) {
        return new Promise((resolve, reject) => {
            if (!cvReady) reject("OpenCV não carregou.");
            let img = new Image();
            img.onload = () => {
                try {
                    let src = cv.imread(img);
                    let gray = new cv.Mat();
                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                    let circles = new cv.Mat();
                    cv.HoughCircles(gray, circles, cv.HOUGH_GRADIENT, 1, 30, 100, 30, 8, 25);
                    if (circles.cols === 0) {
                        src.delete(); gray.delete(); circles.delete();
                        reject("Nenhum círculo detectado.");
                        return;
                    }
                    let circleData = [];
                    for (let i = 0; i < circles.cols; i++) {
                        let x = circles.data32F[i*3];
                        let y = circles.data32F[i*3+1];
                        let r = circles.data32F[i*3+2];
                        circleData.push({ x, y, r });
                    }
                    circleData.sort((a,b) => a.y - b.y);
                    let rows = [];
                    let thresholdY = 25;
                    for (let c of circleData) {
                        let added = false;
                        for (let row of rows) {
                            if (Math.abs(row.avgY - c.y) < thresholdY) {
                                row.circles.push(c);
                                row.avgY = (row.avgY * (row.circles.length-1) + c.y) / row.circles.length;
                                added = true;
                                break;
                            }
                        }
                        if (!added) rows.push({ avgY: c.y, circles: [c] });
                    }
                    for (let row of rows) row.circles.sort((a,b) => a.x - b.x);
                    if (rows.length < numQuestoes - 2 || rows.length > numQuestoes + 2) {
                        src.delete(); gray.delete(); circles.delete();
                        reject(`Detectadas ${rows.length} linhas, esperado ~${numQuestoes}.`);
                        return;
                    }
                    let questoesLinhas = rows.slice(0, numQuestoes);
                    let respostas = {};      // {questao: alternativa}
                    let circlesPositions = {}; // {questao: {altIndex: {x,y,r}}}
                    for (let idx = 0; idx < questoesLinhas.length; idx++) {
                        let row = questoesLinhas[idx];
                        let circlesRow = row.circles.slice(0, numAlternativas);
                        if (circlesRow.length < numAlternativas) continue;
                        circlesPositions[idx+1] = {};
                        for (let j = 0; j < circlesRow.length; j++) {
                            let circ = circlesRow[j];
                            circlesPositions[idx+1][letras[j]] = { x: circ.x, y: circ.y, r: circ.r };
                            let mask = new cv.Mat.zeros(gray.rows, gray.cols, cv.CV_8UC1);
                            cv.circle(mask, new cv.Point(circ.x, circ.y), circ.r-3, new cv.Scalar(255), -1);
                            let mean = new cv.Mat();
                            cv.mean(gray, mask, mean);
                            let intensidade = mean.data64F[0];
                            mask.delete(); mean.delete();
                            if (intensidade < 110) { // pintado
                                if (!respostas[idx+1] || intensidade < (respostas[idx+1].intens || 255)) {
                                    respostas[idx+1] = { alt: letras[j], intens: intensidade };
                                }
                            }
                        }
                    }
                    src.delete(); gray.delete(); circles.delete();
                    resolve({ respostas: Object.fromEntries(Object.entries(respostas).map(([k,v]) => [k, v.alt])), circlesPositions });
                } catch (err) {
                    reject(err.message);
                }
            };
            img.src = imageBase64;
        });
    }

    async function executarCorrecao() {
        if (!currentImageData) {
            logArea.innerHTML += "\n⚠️ Nenhuma imagem capturada. Tire uma foto primeiro.";
            return;
        }
        // Verificar se o gabarito está preenchido para pelo menos 1 questão
        let temGabarito = Object.keys(gabarito).some(k => gabarito[k] && gabarito[k] !== "");
        if (!temGabarito) {
            logArea.innerHTML += "\n⚠️ Defina o gabarito oficial antes de corrigir (selecione as alternativas corretas na tabela à direita).";
            return;
        }
        if (!cvReady) {
            logArea.innerHTML += "\n⏳ OpenCV carregando, aguarde...";
            return;
        }
        logArea.innerHTML += "\n🔍 Processando imagem e detectando bolinhas pintadas...";
        try {
            const { respostas: respostasAluno, circlesPositions } = await detectarRespostasComPontos(currentImageData);
            logArea.innerHTML += `\n📝 Respostas detectadas: ${JSON.stringify(respostasAluno)}`;
            
            // Desenhar a imagem original no canvas
            let img = new Image();
            img.onload = () => {
                resultCanvas.width = img.width;
                resultCanvas.height = img.height;
                let ctx = resultCanvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                let acertos = 0;
                let detalhes = [];
                // Para cada questão, verificar se a resposta detectada corresponde ao gabarito
                for (let i = 1; i <= numQuestoes; i++) {
                    let correta = gabarito[i];
                    let aluno = respostasAluno[i];
                    if (correta && aluno && correta === aluno) {
                        acertos++;
                        detalhes.push(`✅ Q${i}: ${aluno}`);
                        // Desenhar ponto verde limão na posição da bolinha correta
                        if (circlesPositions[i] && circlesPositions[i][aluno]) {
                            let pos = circlesPositions[i][aluno];
                            ctx.beginPath();
                            ctx.arc(pos.x, pos.y, pos.r + 4, 0, 2 * Math.PI);
                            ctx.fillStyle = '#adff2f'; // verde limão
                            ctx.fill();
                            ctx.strokeStyle = '#006400';
                            ctx.lineWidth = 2;
                            ctx.stroke();
                        }
                    } else if (correta && aluno) {
                        detalhes.push(`❌ Q${i}: ${aluno} (gabarito ${correta})`);
                    } else if (correta && !aluno) {
                        detalhes.push(`⚠️ Q${i}: não detectado (gabarito ${correta})`);
                    }
                }
                let nota = (acertos / numQuestoes) * 10;
                scoreDisplay.innerText = `${acertos}/${numQuestoes}`;
                gradeDetail.innerText = `🎓 NOTA: ${nota.toFixed(1)}  (${acertos} acerto${acertos!==1?'s':''})`;
                resultArea.style.display = 'block';
                logArea.innerHTML += `\n📊 CORREÇÃO:\n${detalhes.join('\n')}`;
                logArea.innerHTML += `\n🎉 Total de pontos verdes (acertos): ${acertos}`;
            };
            img.src = currentImageData;
        } catch (err) {
            logArea.innerHTML += `\n❌ Erro: ${err}`;
        }
    }

    // ----------------------------- EVENTOS -----------------------------
    captureBtn.addEventListener('click', capturarFoto);
    toggleCameraBtn.addEventListener('click', toggleCamera);
    fileUpload.addEventListener('change', (e) => { if(e.target.files[0]) carregarUpload(e.target.files[0]); });
    corrigirBtn.addEventListener('click', executarCorrecao);
    resetGabaritoBtn.addEventListener('click', restaurarGabaritoExemplo);
    btnAplicarConfig.addEventListener('click', () => {
        atualizarCartao();
        restaurarGabaritoExemplo();
        logArea.innerHTML += "\n⚙️ Configurações aplicadas. Cartão e gabarito atualizados.";
    });
    btnImprimirCartao.addEventListener('click', () => {
        let conteudo = document.getElementById('printArea').innerHTML;
        let win = window.open('', '_blank');
